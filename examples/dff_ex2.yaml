# 例2：サイクルの途中で rst=1 にした直後、次の立ち上りまで Q が変わらない（非同期リセット版を FAIL にする）
version: 1
top: dff
clock: {signal: clk, period_ns: 10}
reset: {signal: rst, active_low: false, duration_cycles: 2}   # 1〜2サイクル目はリセット、3サイクル目の前に解除
sim: {cycles: 7}

cases:
  - name: sync_reset_waits_for_edge
    stimulus:
      - {at: 3, set: {d: 1}}                   # 25ns で Q=1
      - {at: 4, offset_ns: 3, set: {rst: 1}}   # 38ns：サイクルの途中でリセットを入れる
      - {at: 5, offset_ns: 2, set: {rst: 0}}   # 47ns：リセットを外す
    expect:
      - {at: 4, check: {q: 1}}                 # 35ns
      - {at: 4, offset_ns: 3, check: {q: 1}}   # 38ns：rst=1 の直後も Q は保持（非同期版・組み合わせ版は 0 → FAIL）
      - {at: 4, offset_ns: 7, check: {q: 1}}   # 42ns：立ち下り（40ns）の後も保持
      - {at: 5, check: {q: 0}}                 # 45ns：立ち上りで同期リセット
      - {at: 5, offset_ns: 3, check: {q: 0}}   # 48ns：rst=0 にしても次の立ち上りまで 0（組み合わせ版は 1 → FAIL）
      - {at: 6, check: {q: 1}}                 # 55ns：d=1 を取り込む
