[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "deltasim"
dynamic = ["version"]
description = "SystemVerilog フルスクラッチシミュレータ／テストベンチ自動生成ツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
deltasim = "deltasim.cli:main"

[project.optional-dependencies]
# GUI extras — コア (deltasim 単体) は FastAPI に依存しない
gui = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24.0",
]

[tool.setuptools.dynamic]
version = {attr = "deltasim._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["deltasim*"]

[tool.setuptools.package-data]
deltasim = ["gui/static/*", "gui/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
